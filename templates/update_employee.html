<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Employee</title>
</head>
<body>
<h1>Update Employee</h1>
<form method="POST" action="{{ url_for('update_employee', employee_id=employee[0]) }}">
    <label>Hourly Rate ID:</label>
    <input type="text" name="h_id" value="{{ employee[1] }}" required><br>
    <label>Supervisor ID:</label>
    <input type="text" name="super_id" value="{{ employee[2] }}" required><br>
    <label>Job Type:</label>
    <input type="text" name="job_type" value="{{ employee[3] }}" required><br>
    <label>Start Date:</label>
    <input type="text" name="start_date" value="{{ employee[4] }}" required><br>
    <label>Revenue Type ID:</label>
    <input type="text" name="r_id" value="{{ employee[5] }}" required><br>
    <label>First Name:</label>
    <input type="text" name="f_name" value="{{ employee[6] }}" required><br>
    <label>Middle Name:</label>
    <input type="text" name="m_name" value="{{ employee[7] }}"><br>
    <label>Last Name:</label>
    <input type="text" name="l_name" value="{{ employee[8] }}" required><br>
    <label>Street:</label>
    <input type="text" name="street" value="{{ employee[9] }}" required><br>
    <label>City:</label>
    <input type="text" name="city" value="{{ employee[10] }}" required><br>
    <label>State:</label>
    <input type="text" name="state" value="{{ employee[11] }}" required><br>
    <label>ZIP:</label>
    <input type="text" name="zip" value="{{ employee[12] }}" required><br>
    <button type="submit">Update</button>
</form>
<br>
<a href="{{ url_for('view_employees') }}">Go back to View Employees</a>
</body>
</html>
