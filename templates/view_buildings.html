<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Buildings</title>
</head>
<body>
<h1>View Buildings</h1>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
    </tr>
    {% for building in buildings %}
    <tr>
        <td>{{ building.id }}</td>
        <td>{{ building.name }}</td>
        <td>{{ building.type }}</td>
        <td><a href="{{ url_for('update_building', building_id=building.id) }}">Update</a></td>
    </tr>
    {% endfor %}
</table>
<br>
<br>
<br>
<a href="{{ url_for('buildings') }}">Go Back to Buildings Menu</a>
</body>
</html>
