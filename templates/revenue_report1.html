<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Report</title>
</head>
<body>
<h1>Revenue Report</h1>
<table border="1">
    <thead>
    <tr>
        <th>Revenue Source</th>
        <th>Tickets Sold</th>
        <th>Total Revenue</th>
    </tr>
    </thead>
    <tbody>
    {% for result in results %}
    <tr>
        <td>{{ result['revenue_source'] }}</td>
        <td>{{ result['tickets_sold'] }}</td>
        <td>{{ result['total_revenue'] }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</body>
</html>
