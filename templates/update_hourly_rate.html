<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Hourly Rate</title>
</head>
<body>
<h1>Update Hourly Rate</h1>
<form method="POST" action="{{ url_for('update_hourly_rate', hourly_rate_id=rate_data[0]) }}">
    <label>Rate:</label>
    <input type="text" name="rate" value="{{ rate_data[1] }}" required><br>
    <button type="submit">Update</button>
</form>
<br>
<a href="{{ url_for('view_hourly_rate') }}">Go back to View Hourly Rate</a>
</body>
</html>
