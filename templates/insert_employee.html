<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Employee</title>
</head>
<body>
<h1>Insert Employee</h1>
<form method="POST">
    <label>ID</label>
    <input type="text" name="id" required><br>
    <label>First Name:</label>
    <input type="text" name="f_name" required><br>
    <label>Middle Name:</label>
    <input type="text" name="m_name"><br>
    <label>Last Name:</label>
    <input type="text" name="l_name" required><br>
    <label>Street:</label>
    <input type="text" name="street" required><br>
    <label>City:</label>
    <input type="text" name="city" required><br>
    <label>State:</label>
    <input type="text" name="state" required><br>
    <label>Zip:</label>
    <input type="text" name="zip" required><br>
    <label>Start Date:</label>
    <input type="date" name="start_date" required><br>
    <label>Job Type:</label>
    <input type="text" name="job_type" required><br>
    <!-- Dropdown list for Hourly Rate ID (hourly_rate_id) -->
    <label>Hourly Rate ID:</label>
    <select name="h_id" required>
        {% for rate in hourly_rates %}
        <option value="{{ rate[0] }}">{{ rate[1] }}</option>
        {% endfor %}
    </select><br>

    <!-- Dropdown list for Supervisor ID (supervisor_id) -->
    <label>Supervisor ID:</label>
    <select name="supervisor_id" required>
        {% for supervisor in supervisors %}
        <option value="{{ supervisor[0] }}">{{ supervisor[1]}}</option>
        {% endfor %}
    </select><br>

    <!-- Dropdown list for Revenue Type ID (revenue_type_id) -->
    <label>Revenue Type ID:</label>
    <select name="revenue_type_id" required>
        {% for revenue_type in revenue_types %}
        <option value="{{ revenue_type[0] }}">{{ revenue_type[1] }}</option>
        {% endfor %}
    </select><br>

    <button type="submit">Insert</button>
</form>
<br>
<a href="{{ url_for('view_employees') }}">Go Back to Employees Menu</a>
</body>
</html>
