<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoo Report</title>
</head>
<body>
<h1>Zoo Report</h1>
<table border="1">
    <thead>
    <tr>
        <th>Species Name</th>
        <th>Total Population</th>
        <th>Total Monthly Food Cost</th>
        <th>Status</th>
        <th>Total by Status</th>
        <th>Total Veterinarian Cost</th>
        <th>Total Care Specialist Cost</th>
    </tr>
    </thead>
    <tbody>
    {% for result in result %}
    <tr>
        <td>{{ result[0] }}</td>
        <td>{{ result[1] }}</td>
        <td>{{ result[2] }}</td>
        <td>{{ result[3] }}</td>
        <td>{{ result[4] }}</td>
        <td>{{ result[5] }}</td>
        <td>{{ result[6] }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</body>
</html>
