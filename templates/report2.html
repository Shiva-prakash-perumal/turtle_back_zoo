<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Report</title>
</head>
<body>
<h1>Animal Report</h1>
<table border="1">
    <tr>
        <th>Species Name</th>
        <th>Status</th>
        <th>Total Animals</th>
        <th>Total Monthly Food Cost</th>
        <th>Total Veterinarian Cost</th>
        <th>Total Care Specialist Cost</th>
    </tr>
    {% for row in result %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
        <td>{{ row[5] }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
